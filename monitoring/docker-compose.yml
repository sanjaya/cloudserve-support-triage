# Prometheus and Grafana for the CloudServe triage dashboard (B-12).
#   docker compose -f monitoring/docker-compose.yml up -d     # start
#   docker compose -f monitoring/docker-compose.yml down      # stop
# Grafana: http://localhost:3000 (the dashboard "CloudServe triage" is loaded automatically)
# Prometheus: http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]   # needed on Linux; harmless on Mac
  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # local use only: open the dashboard without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_DEFAULT_THEME: "light"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
